name: Release

# Triggered by pushing a version tag, e.g. `git tag v0.1.1 && git push origin v0.1.1`.
on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon (arm64)
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest # Intel (x86_64)
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-22.04
            target: ""
            args: ""
          - platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Claude Token Monitor ${{ github.ref_name }}"
          releaseBody: |
            Cross-platform release built by GitHub Actions.

            Download the installer for your OS below (Windows `.exe`/`.msi`,
            macOS `.dmg` for Apple Silicon and Intel, Linux `.AppImage`/`.deb`).

            ⚠️ Unofficial community tool, not affiliated with Anthropic. The live
            usage API uses an undocumented endpoint and may break; local
            estimates always work. Your OAuth token is read locally and sent only
            to Anthropic's own endpoints over HTTPS.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
